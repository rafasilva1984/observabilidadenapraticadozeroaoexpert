version: "3.8"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: aula03-traces-elasticsearch-1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.monitoring.collection.enabled=true
    ports:
      - "9200:9200"
    networks:
      - traces-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: aula03-traces-kibana-1
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - traces-net

  apm-server:
    image: docker.elastic.co/apm/apm-server:8.15.0
    container_name: aula03-traces-apm-server-1
    command: >
      apm-server -e
        -E output.elasticsearch.hosts=["http://elasticsearch:9200"]
        -E apm-server.kibana.enabled=true
        -E apm-server.kibana.host="kibana:5601"
        -E apm-server.auth.anonymous.enabled=true
    ports:
      - "8200:8200"
    depends_on:
      - elasticsearch
      - kibana
    networks:
      - traces-net

  app:
    build: ./app
    container_name: aula03-traces-app-1
    environment:
      - ELASTIC_APM_SERVER_URL=http://apm-server:8200
      - ELASTIC_APM_SERVICE_NAME=lab-traces-app
      - ELASTIC_APM_ENVIRONMENT=lab-traces
    ports:
      - "8000:8000"
    depends_on:
      - apm-server
    networks:
      - traces-net

networks:
  traces-net:
    driver: bridge
